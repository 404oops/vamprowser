<!doctype html><meta charset="utf-8"><title>Popup regression check</title><style>body{font:22px system-ui;padding:35px}button{font:inherit;padding:15px;margin:10px}pre{white-space:pre-wrap}</style><h1>Popup regression check</h1><button onclick="test(false)">Open related popup</button><button onclick="test(true)">Open blank then navigate</button><p><a href="child.html" target="_blank">Open a normal link in a new tab</a></p><p><a href="child.html" target="_blank" rel="noopener">Open a noopener link in a new tab</a></p><pre id="result">Ready</pre><script>let child; function report(s){result.textContent+='\n'+s} function test(blank){document.cookie='popup_test=shared; SameSite=Lax; path=/';result.textContent='Starting';child=window.open(blank?'about:blank':'/child.html','popup-test','width=520,height=620');report('window.open returned: '+(child?'window':'null'));if(child&&blank)child.location='/child.html';} addEventListener('message',e=>{if(e.origin!==location.origin||!e.data||typeof e.data.opener!=='boolean')return;report('Message: '+JSON.stringify(e.data));report('Message source matches popup: '+(e.source===child));setTimeout(()=>report('Popup closed: '+child.closed),1200);});</script>
